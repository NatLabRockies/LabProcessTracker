name: pytest

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: tandems-runners
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        env: [
          '.[test]',
          '--upgrade --upgrade-strategy=eager .[test]'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ${{ matrix.env }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.env }}

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Report results
        if: always()
        run: |
          echo "Tests completed for Python ${{ matrix.python-version }}"