[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process_tracking"
version = "0.5.0"
description = "A tracking application that logs scan events for samples and processes."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name="Rajiv Daxini", email="Rajiv.Daxini@nrel.gov" }
]
dependencies = []

[project.optional-dependencies]
build = [
    "pyinstaller>=5.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pyinstaller>=5.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/rdaxini/process_tracking"
Issues = "https://github.com/rdaxini/process_tracking/issues"
Changelog = "https://github.com/rdaxini/process_tracking/tree/main/whatsnew"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src", "scripts"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "src/process_tracker_gui.py",
    "src/process_tracker.py",
    "scripts/create_exe.py",
    "scripts/generate_custom_qr_codes.py",
    "scripts/generate_test_qr_codes.py",
    "scripts/run_tests.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if False:",
    "if typing.TYPE_CHECKING:",
]
